    <!-- Aplica o tema salvo antes da renderização para evitar flash -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        if (stored !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
